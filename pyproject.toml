[project]
name = "bento-benchmark"
version = "0.1.0"
description = "Benchmark utilities and analysis pipeline for protein-ligand docking evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "LigandPro Team" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.20",
  "statsmodels>=0.14",
  "networkx>=3.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
annotation = [
  "pandarallel>=1.6",
  "psutil>=5.9",
  "rdkit>=2023.9.6",
]
similarity = [
  "pymol-open-source>=3.2.0a0; platform_system == 'Linux'",
]
lint = [
  "ruff>=0.12.0",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
bento = "bento.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bento"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "scripts_bckp",
  "scripts/04_make_subsets_and_draw_plots.ipynb",
]
lint.select = ["E", "F", "I", "B"]
lint.ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["src/bento", "scripts"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
